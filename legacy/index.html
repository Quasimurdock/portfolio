<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio</title>
<meta name="description" content="Portfolio — a lightweight, single-file Vue rebuild of a photographer's studio site structure.">
<meta name="theme-color" content="#ffffff">
<!-- inline mark: black plate, white "P" (keeps the tab in the same monochrome key) -->
<link rel="icon" href="data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20fill='%23000'/%3E%3Ctext%20x='16'%20y='23'%20font-family='Helvetica,Arial'%20font-size='20'%20font-weight='700'%20fill='%23fff'%20text-anchor='middle'%3EP%3C/text%3E%3C/svg%3E">

<!-- Typeface: Archivo (free grotesque, closest available stand-in for the reference site's
     licensed "Univers Next W01"). The stack degrades to Helvetica / Arial if the CDN is
     unreachable, so the layout never depends on the webfont. Loaded non-blocking. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" media="print" onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap"></noscript>

<style>
/* ==========================================================================
   Portfolio — single-file Vue 3 app
   Structure replicated from nadavkander.com:
     fixed header (title + 4-column nav)  >  header placeholder  >  mobile title
     >  main content (feed slideshow | series grid | series lightbox | lists)
     >  footer (subscribe + social + copyright)
   Measured reference geometry is encoded directly in the rules below.
   ========================================================================== */

/* ---------- tokens ---------- */
:root{
  --ink:#000;
  --paper:#fff;
  --rule:#e6e6e6;
  --rule-soft:#f0f0f0;
  --muted:rgba(0,0,0,.5);
  --plate:rgba(0,0,0,.075);       /* image placeholder grey */
  --gutter:4vw;                    /* page side margin (grid-wrap) */
  --half:2vw;                      /* half gutter (container--half-pad) */
  --header-h:113px;                /* fixed header height, >=1024px */
  --placeholder-h:77px;            /* spacer under the header */
  --footer-h:52px;                 /* footer height — refined at runtime by script */
  --feed-pad-top:50px;             /* studio-feed breathing space */
  --feed-pad-bottom:164px;
  --title-h:37px;                  /* page title bar height (9px padding + line + 9px) */
  --title-gap:25px;                /* air between the page title bar and the content */
  --title-mark-w:4px;              /* vertical marker left of the page title */
  --title-mark-h:15px;
  --title-mark-gap:9px;
  --ease:cubic-bezier(.22,.61,.36,1);
  --ease-out:cubic-bezier(.16,1,.3,1);
}
@media (min-width:1250px){
  :root{ --gutter:50px; --half:25px; }   /* 4.16667em / 2.08333em at a 12px base */
}
@media (min-width:1024px){
  :root{ --placeholder-h:var(--header-h); }
}

/* ---------- reset ---------- */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font-family:'Archivo','Univers Next W01',Helvetica,'Helvetica Neue',Arial,sans-serif;
  font-size:12px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
}
img{ border:0; max-width:100%; display:block; }
a{ color:inherit; text-decoration:none; }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
h1,h2,h3,p,figure,fieldset{ margin:0; }
fieldset{ border:0; padding:0; min-width:0; }
ul{ margin:0; padding:0; list-style:none; }
input{ font:inherit; color:inherit; }
::selection{ background:#000; color:#fff; }
:focus-visible{ outline:1px solid #000; outline-offset:2px; }

.clear::after{ content:''; display:table; clear:both; }
.container{ width:100%; padding:0 var(--gutter); }

/* ==========================================================================
   Header
   ========================================================================== */
.site-header{
  position:fixed; top:0; left:0; width:100%;
  z-index:15;
  background:var(--paper);
  -webkit-backface-visibility:hidden;
  backface-visibility:hidden;
  transform:translateZ(0);
}
.site-header__inner{ padding-bottom:0; }
.site-header .wrapper{
  position:relative;
  padding:9px 0 45px;                       /* 0.5625rem 0 3.71667em */
  border-bottom:1px solid transparent;
  transition:border-color 150ms linear;
}
.site-header.is-scrolled .wrapper{ border-bottom-color:var(--rule); }

.site-title{ font-weight:700; }
.site-title a{ transition:opacity 200ms linear; }
.site-title a:hover{ opacity:.55; }

.nav-trigger{
  display:none;
  float:right;
  position:relative;
  z-index:10;
  width:26px; height:19px;
  background:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='25' height='17'%3E%3Cg fill='none' stroke='%23000' stroke-width='1'%3E%3Cpath d='M0 .5h25M0 8.5h25M0 16.5h25'/%3E%3C/g%3E%3C/svg%3E") no-repeat 0 50%;
  background-size:25px 17px;
  border-radius:0;
  transition:opacity 200ms linear;
}
.nav-trigger:hover{ opacity:.55; }
.nav-trigger.is-open{
  background-image:url("data:image/svg+xml;charset=utf-8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='25' height='17'%3E%3Cg fill='none' stroke='%23000' stroke-width='1'%3E%3Cpath d='M1 1l23 15M24 1L1 16'/%3E%3C/g%3E%3C/svg%3E");
}

.site-nav ul{
  margin:0; padding:0; list-style:none;
  display:flex;
  flex-flow:column wrap;                    /* fills 3 rows, then wraps into columns */
  height:58px;
  column-gap:50px;
}
.site-nav li{ display:block; white-space:nowrap; }
.site-nav li.active{ font-weight:600; }
.site-nav a{ display:block; transition:opacity 200ms linear; }
.site-nav a:hover{ opacity:.5; }

/* nav column behaviour (measured): 4 equal columns >=1250px, content-sized columns
   distributed across the right half between 1024 and 1249px */
@media (min-width:1024px){
  .site-title{ position:absolute; left:0; top:9px; font-size:16.5px; line-height:1.25; }
  .site-nav{ float:right; width:46vw; max-width:575px; padding-left:2vw; }
}
@media (min-width:1024px) and (max-width:1249px){
  .site-nav ul{ justify-content:space-between; column-gap:2vw; }
}
@media (min-width:1250px){
  .site-nav{ float:left; margin-left:50%; padding-left:25px; }
}

/* --- mobile / tablet: title bar + collapsible nav --- */
@media (max-width:1023px){
  .site-header .wrapper{ padding:9px 0 10px; }
  .site-title{ float:left; position:relative; z-index:10; font-size:12px; line-height:1.6; }
  .nav-trigger{ display:block; }
  .nav-wrapper{
    display:none;
    clear:both;
  }
  .nav-wrapper.is-open{ display:block; animation:reveal 260ms var(--ease-out) both; }
  .site-nav{ padding:9.8px 0; margin:0 var(--gutter); border-bottom:1px solid var(--rule); }
  .site-nav ul{
    display:block; height:auto;
    column-count:2; column-gap:4vw;
    margin:-.4rem 0;
  }
  .site-nav ul li{ break-inside:avoid; }
  .site-nav a{ padding:.4rem 0; }
  .site-title a, .site-nav a{ font-size:12px; }
}

.header-placeholder{ height:var(--placeholder-h); }

/* ==========================================================================
   Page title bar
   The reference shows this band below 1024px only ("mobile-title"); here it
   stays visible at every width so a page always announces itself.
   ========================================================================== */
.page-title{ display:block; width:100%; }
.page-title__section{
  position:relative;
  padding:9px 0 9px calc(var(--title-mark-w) + var(--title-mark-gap));
  font-weight:700;
}
/* a narrow vertical bar sits on the left alignment line, the title hangs beside it
   (absolutely positioned, so the bar height stays 37px and the layout maths hold) */
.page-title__section::before{
  content:'';
  position:absolute;
  left:0; top:50%;
  transform:translateY(-50%);
  width:var(--title-mark-w);
  height:var(--title-mark-h);
  background:#000;
}
.page-title__section:empty{ display:none; }   /* the studio feed has no title */

/* ==========================================================================
   Content shell
   ========================================================================== */
.site-content{ position:relative; }
/* only pages that actually show a title bar get the extra top space, so the
   studio feed (which has no title) keeps its exact viewport-fitting height */
.site-content.has-page-title{ padding-top:var(--title-gap); }

/* Sticky footer: the page is at least one viewport tall and the footer is
   pushed to the bottom of it, so a short page never leaves the footer stranded
   in the middle of the screen. The studio feed is excluded — it pins its own
   footer and sizes its stage for the viewport itself, so stretching its main
   region would push the count/caption line under that fixed footer. */
.site{
  display:flex;
  flex-direction:column;
  min-height:100vh;
  min-height:100dvh;
}
.load-content{
  display:flex;
  flex-direction:column;
  flex:1 1 auto;
}
.site-content{ flex:1 0 auto; }        /* absorb the leftover height */
.is-feed .site-content{ flex:0 0 auto; }
.site-footer{ margin-top:auto; }       /* and hold the footer down */

/* ==========================================================================
   Slider — a three-slide window (prev / current / next) that follows the
   finger and snaps. Used by the studio feed and the series lightbox.
   ========================================================================== */
.slider-viewport{ position:relative; width:100%; height:100%; overflow:hidden; }
.slider-track{
  display:flex;
  height:100%;
  width:calc(100% * var(--slide-count, 3));
  will-change:transform;
  backface-visibility:hidden;
}
.slider-slide{
  flex:0 0 calc(100% / var(--slide-count, 3));
  height:100%;
  min-width:0;
  display:flex;
  align-items:center;
  justify-content:center;
}

/* ==========================================================================
   Grids (series index pages, series thumbnails, list pages, monographs)
   ========================================================================== */
.grid-wrap{ margin:0 var(--gutter); overflow:hidden; }
.image-grid{ margin:0 calc(-1 * var(--gutter)); }
.container--half-pad{ padding:0 var(--half); }

.grid-single{
  display:inline-block;
  vertical-align:top;
  width:100%;
  margin:0 0 var(--gutter);
}
.grid-single__inner{
  display:block;
  position:relative;
  margin:0 var(--half);
}
.grid-single__img-wrap{ position:relative; overflow:hidden; }

/* aspect-ratio box (padding-bottom 130%) with a grey plate until the image arrives */
.grid-single__img{
  position:relative;
  padding-bottom:130%;
  background-color:var(--plate);
  background-size:cover;
  background-position:50% 50%;
  background-repeat:no-repeat;
}
.grid-single__img::after{
  content:'';
  position:absolute; inset:0;
  background-image:inherit;               /* inherits the URL the loader sets */
  background-size:cover;
  background-position:50% 50%;
  background-repeat:no-repeat;
  opacity:0;
  transition:opacity 700ms var(--ease);
}
.grid-single__img.is-loaded::after{ opacity:1; }
/* while a photograph is in flight the plate breathes, so a slow connection reads
   as "loading" rather than "broken" */
.grid-single__img.is-loading{ animation:platePulse 1.8s ease-in-out infinite; }
@keyframes platePulse{
  0%,100%{ background-color:rgba(0,0,0,.055); }
  50%{ background-color:rgba(0,0,0,.115); }
}
.grid-single__caption{ margin:9px 0; line-height:1.6; }
@media (min-width:400px){
  .grid-single__caption{ margin:9px 0 27px; }   /* 3-line caption rhythm, as measured */
}
.grid-single__caption strong{ font-weight:700; }
.grid-single__meta{ color:var(--muted); }

/* hover: the reference darkens nothing, it simply lets the work breathe */
@media (hover:hover){
  .grid-single__inner:hover .grid-single__img::after{ opacity:.92; }
  .grid-single__inner:hover .grid-single__caption strong{ text-decoration:underline; text-underline-offset:2px; }
}
.grid-single__inner:focus-visible{ outline:1px solid #000; outline-offset:4px; }

/* staggered entrance for grid cards */
.grid-single{ animation:rise 620ms var(--ease-out) both; animation-delay:calc(min(var(--i,0),11) * 45ms); }

@media (min-width:400px){ .grid-single{ width:50%; } }
@media (min-width:768px){ .grid-single{ width:33.3333%; } }
@media (min-width:1024px){
  .grid-single{ width:25%; margin-bottom:50px; }
}

/* Series thumbnails — deliberately a smaller, denser register than the hero
   above them, at every width, so a thumbnail never reads as another hero frame.
   (The generic grid widths would leave one full-width column on phones, making
   each thumbnail almost the size of the photograph itself.) */
.image-grid--thumbs{ padding-top:24px; }
.image-grid--thumbs .grid-single{ width:33.3333%; margin-bottom:9px; }
.image-grid--thumbs .grid-single__caption{ font-size:11px; color:var(--muted); margin:9px 0; }
.image-grid--thumbs .grid-single.is-active .grid-single__img{
  outline:1px solid #000;
  outline-offset:-4px;
}
.image-grid--thumbs .grid-single.is-active .grid-single__caption{ color:#000; }
@media (max-width:479px){
  .image-grid--thumbs .grid-single{ width:50%; }        /* two up on small phones */
}
@media (min-width:1024px){
  .image-grid--thumbs{ padding-top:50px; }
  .image-grid--thumbs .grid-single{ width:16.6667%; }  /* six up on desktop */
}

/* bordered list pages (News / Exhibitions / Essays & Reviews) */
.grid-single--list .grid-single__inner{
  border-top:1px solid var(--rule);
  padding-top:9px;
  min-height:100%;
}
.grid-single--list .grid-single__caption{ margin:0 0 27px; }
@media (min-width:1024px){ .grid-single--list{ width:33.3333%; } }

/* film cards */
.film-card .grid-single__img{ padding-bottom:56.25%; }
.film-card .play{
  position:absolute; inset:0; margin:auto;
  width:38px; height:38px;
  border:1px solid rgba(255,255,255,.85);
  border-radius:50%;
  background:rgba(0,0,0,.25);
  z-index:2;
  transition:transform 300ms var(--ease), background 300ms linear;
}
.film-card .play::after{
  content:''; position:absolute; inset:0; margin:auto;
  width:0; height:0;
  border-left:10px solid #fff;
  border-top:6px solid transparent;
  border-bottom:6px solid transparent;
  transform:translateX(2px);
}
.film-card .grid-single__inner:hover .play{ transform:scale(1.08); background:rgba(0,0,0,.45); }

/* ==========================================================================
   Studio feed (home) — full-viewport slideshow with a count + caption line
   ========================================================================== */
.site-content--feed{ padding:var(--feed-pad-top) 0 var(--feed-pad-bottom); }
.swiper-curated{
  position:relative;
  /* the stage fills exactly what is left between header, info line and the pinned footer */
  height:calc(100vh - var(--placeholder-h) - var(--feed-pad-top) - var(--feed-pad-bottom) - var(--footer-h));
  height:calc(100dvh - var(--placeholder-h) - var(--feed-pad-top) - var(--feed-pad-bottom) - var(--footer-h));
  min-height:240px;
  opacity:0;
  transition:opacity 700ms var(--ease);
}
.swiper-curated.is-ready{ opacity:1; }
.curated-wrap{
  position:relative;
  height:100%;
  padding:0 var(--half);
  display:flex;
  align-items:center;
  justify-content:center;
}
.curated-col{ display:flex; align-items:center; justify-content:center; height:100%; width:100%; }
.curated-single{
  display:flex; align-items:center; justify-content:center;
  height:100%; width:100%;
}
.curated-single img{
  max-width:100%;
  max-height:100%;
  width:auto; height:auto;
  object-fit:contain;
}
.curated-nav{
  position:absolute; top:0; bottom:0;
  width:14vw; max-width:160px;
  z-index:2;
  opacity:0;
  transition:opacity 250ms linear;
}
.curated-nav::after{
  content:''; position:absolute; top:50%; left:50%;
  width:9px; height:9px;
  border-top:1px solid #000; border-right:1px solid #000;
}
.curated-nav--prev{ left:0; }
.curated-nav--prev::after{ transform:translate(-50%,-50%) rotate(-135deg); }
.curated-nav--next{ right:0; }
.curated-nav--next::after{ transform:translate(-50%,-50%) rotate(45deg); }
.swiper-curated:hover .curated-nav{ opacity:.35; }
.curated-nav:hover{ opacity:1 !important; }

.swiper-curated__info{
  position:absolute;
  bottom:0; left:var(--gutter); right:var(--gutter);
  padding:0 0 9px;
  display:flex;
  align-items:baseline;
}
.swiper-curated__count{ display:inline-block; margin:0 1.5em 0 0; font-variant-numeric:tabular-nums; }
.swiper-curated__caption{ display:none; color:var(--muted); }
@media (min-width:1024px){ .swiper-curated__caption{ display:inline-block; } }

/* feed keeps the footer pinned, exactly like the reference */
.is-feed .site-footer{ position:fixed; bottom:0; left:0; width:100%; background:var(--paper); z-index:12; }
@media (max-width:1023px){
  :root{ --feed-pad-top:24px; --feed-pad-bottom:120px; --footer-h:90px; }
}

/* ==========================================================================
   Series (lightbox hero + thumbnail strip)
   ========================================================================== */
.lightbox-gallery{
  position:relative;
  /* 184px = header band + slack (reference value); the title bar and its gap are
     then discounted so title area + hero still fill the first screen as the
     reference's 716px hero does */
  height:calc(100vh - 184px - var(--title-h) - var(--title-gap));
  height:calc(100dvh - 184px - var(--title-h) - var(--title-gap));
  min-height:360px;
}
.single-lightbox{
  position:absolute; inset:0;
  padding-bottom:31.25px;
  overflow:hidden;
}
.single-lightbox__img-wrap{
  position:relative;
  height:100%;
  padding:0 var(--gutter);
  display:flex;
  align-items:center;
  justify-content:center;
}
.single-lightbox__img-wrap img{
  max-width:100%;
  max-height:100%;
  width:auto; height:auto;
  object-fit:contain;
  opacity:0;
  transition:opacity 600ms var(--ease);
}
.single-lightbox__img-wrap img.is-loaded{ opacity:1; }

.lightbox-nav{
  position:absolute; top:0; bottom:0; width:12vw; max-width:150px; z-index:2;
  opacity:0; transition:opacity 250ms linear;
}
.lightbox-nav::after{
  content:''; position:absolute; top:50%; left:50%;
  width:10px; height:10px;
  border-top:1px solid #000; border-right:1px solid #000;
}
.lightbox-nav--prev{ left:0; }
.lightbox-nav--prev::after{ transform:translate(-50%,-50%) rotate(-135deg); }
.lightbox-nav--next{ right:0; }
.lightbox-nav--next::after{ transform:translate(-50%,-50%) rotate(45deg); }
.lightbox-gallery:hover .lightbox-nav{ opacity:.35; }
.lightbox-nav:hover{ opacity:1; }

/* touch behaviour: vertical page scrolling and pinch-zoom stay native, so the
   only gestures the swipe handler has to deal with are horizontal ones */
.single-lightbox,
.slider-viewport,
.slider-viewport img,
.swiper-curated,
.curated-single img{ touch-action:pan-y pinch-zoom; }

.lightbox-info{
  position:absolute; bottom:0; left:var(--gutter); right:var(--gutter);
  display:flex; align-items:baseline; gap:18px;
  padding-bottom:6px;
}
.lightbox-info__count{ font-variant-numeric:tabular-nums; white-space:nowrap; }
.lightbox-info__caption{ color:var(--muted); }

.close-page{
  display:none;
  position:relative;
  height:38px;
  border-bottom:1px solid var(--rule);
}
.close-page__label{
  position:absolute; left:var(--gutter); top:9px;
  font-weight:600;
}
.close-page__label::before{ content:'\2190\00a0\00a0'; }

@media (max-width:1023px){
  .close-page{ display:block; }
  /* the photo occupies a fixed 58vh stage and the caption flows underneath it,
     inside the (auto-height) lightbox — so the caption is never pushed into the
     overflow region and clipped away */
  .lightbox-gallery{ height:auto; min-height:0; }
  .single-lightbox{ position:relative; inset:auto; height:auto; padding-bottom:0; overflow:visible; }
  .single-lightbox__img-wrap{ height:58vh; padding:9px var(--half) 0; }
  /* the caption is a real in-flow block here, so it needs its own gutter (the
     desktop rule used absolute left/right offsets, which do nothing once the
     element is static) and a hairline to close the hero off from the
     thumbnail strip below it */
  .lightbox-info{
    position:relative;
    left:auto; right:auto;          /* the base rule's absolute offsets must not shift a relative box */
    display:block;
    padding:9px var(--gutter) 14px; /* on the same gutter as the title bar and the grid */
  }
  .lightbox-info::after{
    content:'';
    position:absolute;
    left:var(--gutter); right:var(--gutter); bottom:0;
    height:1px;
    background:var(--rule);
  }
  .lightbox-info__count{ display:block; }
  /* primary register: this is the photograph you are looking at, not a thumbnail label */
  .lightbox-info__caption{ color:#000; }
  .lightbox-nav{ width:22vw; top:0; bottom:auto; height:58vh; }
}

/* ==========================================================================
   Biography / Contact
   ========================================================================== */
.article{ padding:0 var(--gutter) 60px; max-width:1440px; }
.article__body{ max-width:66ch; }
.article__body p{ margin:0 0 1.6em; }
.article__lead{ font-size:15px; line-height:1.55; font-weight:500; letter-spacing:-.005em; }
@media (min-width:1024px){
  .article__body{ columns:2; column-gap:50px; max-width:none; }
  .article__lead{ font-size:18px; line-height:1.45; }
}
.article h2{ font-size:12px; font-weight:700; margin:0 0 .6em; }
.article__rule{ height:1px; background:var(--rule); margin:0 0 34px; }
.article__rule--short{ width:2em; background:#d9d9d9; }

/* One written piece (Essays & Reviews, Exhibitions & Talks, News). Unlike the
   biography it stays a single measured column however wide the window is. */
.post__meta{ color:var(--muted); margin:0 0 1.4em; }
.post__back{ margin:34px 0 0; }
.post__back a{
  border-bottom:1px solid var(--rule);
  transition:border-color 200ms linear, color 200ms linear;
}
.post__back a:hover{ border-bottom-color:#000; color:#000; }
@media (min-width:1024px){
  .post .article__body{ columns:1; max-width:66ch; }
}

.contact-columns{ display:block; font-size:12px; }
.contact-col{ display:block; margin:0 0 27px; }
.contact-col h2{ font-weight:700; margin:0 0 .4em; }
.contact-col p{ color:var(--muted); }
.contact-col a{ border-bottom:1px solid var(--rule); transition:border-color 200ms linear; }
.contact-col a:hover{ border-bottom-color:#000; color:#000; }
@media (min-width:768px){
  .contact-columns{ display:flex; gap:var(--gutter); }
  .contact-col{ width:25%; margin-bottom:0; }
}

/* ==========================================================================
   Footer
   ========================================================================== */
.site-footer{ width:100%; color:var(--muted); }
.site-footer__wrap{
  position:relative;
  border-top:1px solid var(--rule);
  padding:13px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
}
.footer-newsletter{ display:flex; align-items:center; gap:18px; min-width:0; }
.newsletter-form{ display:flex; align-items:center; gap:8px; }
.footer-paragraph{ display:inline-block; vertical-align:middle; line-height:24px; margin:0 8px 0 0; }
.site-footer a{ transition:color 200ms linear; }
.site-footer a:hover{ color:#000; }
.footer-social a + a{ margin-left:9px; }
.newsletter-form fieldset{ display:flex; align-items:center; gap:8px; }
.input--text{
  width:190px;
  border:0; border-bottom:1px solid var(--rule);
  background:transparent;
  padding:0 0 3px;
  line-height:18px;
  transition:border-color 200ms linear;
}
.input--text::placeholder{ color:var(--muted); }
.input--text:focus{ outline:0; border-bottom-color:#000; }
.input--button-blank{
  border:0;                        /* reset the native button chrome: this is a text button */
  background:transparent;
  padding:0;
  cursor:pointer;
  text-decoration:underline;
  text-underline-offset:2px;
  white-space:nowrap;
}
/* the wrap is a flex row: newsletter left, copyright hard against the right edge */
.footer-copyright{ white-space:nowrap; margin-left:auto; text-align:right; }

@media (max-width:1023px){
  /* The footer prefers a single line: nothing here forces a break, and the
     column gap tightens so even a 320px screen still fits. If it genuinely has
     to wrap (e.g. the subscribe field is open) the two rows stay tight and the
     wrap keeps the only top border — the copyright no longer draws its own. */
  .site-footer__wrap{ padding:9px 0; flex-wrap:wrap; column-gap:12px; row-gap:6px; }
  .footer-newsletter{ gap:18px; row-gap:4px; flex-wrap:wrap; }
  .input--text{ width:140px; }
  .footer-copyright{ margin-left:0; text-align:left; }
}

/* ==========================================================================
   Animations
   ========================================================================== */
@keyframes rise{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
@keyframes reveal{ from{ opacity:0; } to{ opacity:1; } }
@keyframes slowFadeIn{ from{ opacity:0; } to{ opacity:1; } }
.site-header--fade .nav-wrapper{ animation:slowFadeIn 900ms 1500ms both; }
.swiper-curated__info{ animation:reveal 700ms 300ms both; }

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{ animation-duration:.001ms !important; animation-delay:0ms !important; transition-duration:.001ms !important; }
}

/* image that failed to load falls back to a generated plate */
.is-fallback{ background-color:var(--plate); }

/* no-Vue notice */
.no-vue #app{ display:none; }
.boot-error{
  padding:48px var(--gutter);
  font-size:14px; line-height:1.6;
  max-width:60ch;
}
.boot-error code{ font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
</style>
</head>

<body>
<div id="app">
 <div class="site" :class="rootClass">
  <!-- ===================== header ===================== -->
  <header class="site-header" :class="{ 'is-scrolled': scrolled, 'site-header--fade': isFeed }" role="banner">
    <div class="container">
      <div class="site-header__inner">
        <div class="wrapper clear">
          <div class="nav-bar-wrapper clear">
            <div class="site-title"><a href="#/" @click="closeNav">Portfolio</a></div>
            <button class="nav-trigger"
                    type="button"
                    :class="{ 'is-open': navOpen }"
                    :aria-expanded="String(navOpen)"
                    aria-controls="site-nav"
                    aria-label="Toggle navigation"
                    @click="navOpen = !navOpen"></button>
          </div>
          <div class="nav-wrapper clear" :class="{ 'is-open': navOpen }">
            <nav class="site-nav" id="site-nav" role="navigation" aria-label="Primary">
              <ul>
                <li v-for="item in nav" :key="item.path" :class="{ active: isActive(item.path) }">
                  <a :href="'#' + item.path" @click="closeNav">{{ item.label }}</a>
                </li>
              </ul>
            </nav>
          </div>
        </div>
      </div>
    </div>
  </header>

  <div class="header-placeholder"></div>

  <div class="load-content">
    <!-- ================= page title bar ================= -->
    <div class="page-title">
      <div class="container">
        <div class="page-title__section">{{ sectionTitle }}</div>
      </div>
    </div>

    <!-- ===================== main ===================== -->
    <main class="site-content"
          :class="[contentClass, { 'has-page-title': !!sectionTitle }]"
          id="content" role="main" :key="viewKey">

      <!-- ---------- Studio feed ---------- -->
      <template v-if="view.kind === 'feed'">
        <div class="swiper-curated__info">
          <span class="swiper-curated__count">{{ pad(feedIndex + 1) }} / {{ pad(feedItems.length) }}</span>
          <span class="swiper-curated__caption">{{ currentFeed.caption }}</span>
        </div>
        <div class="swiper-curated" :class="{ 'is-ready': currentFeed }"
             @touchstart.passive="sliderStart"
             @touchmove.passive="sliderMove"
             @touchend="sliderEnd"
             @touchcancel="sliderEnd">
          <div class="curated-wrap">
            <div class="curated-col">
              <div class="slider-viewport" ref="viewport">
                <div class="slider-track" :style="trackStyle">
                  <div class="slider-slide" v-for="s in slides" :key="s.key">
                    <a class="curated-single" :href="'#' + s.item.path" :aria-label="s.item.caption">
                      <img v-lazy="{ key: 'feed-' + s.item.key, src: s.item.src, srcset: s.item.srcset, sizes: imageSizes, ratio: s.item.ratio }"
                           :alt="s.item.caption"
                           loading="lazy"
                           decoding="async">
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
          <button class="curated-nav curated-nav--prev" type="button" aria-label="Previous" @click="feedPrev"></button>
          <button class="curated-nav curated-nav--next" type="button" aria-label="Next" @click="feedNext"></button>
        </div>
      </template>

      <!-- ---------- Series index (grid of works) ---------- -->
      <template v-else-if="view.kind === 'grid'">
        <div class="grid-wrap">
          <div class="image-grid image-grid--4x-portrait">
            <div class="container container--half-pad">
              <div v-for="(s, i) in view.items"
                   class="grid-single grid-single--bordered grid-single--portrait"
                   :class="{ 'film-card': view.film }"
                   :key="s.slug"
                   :style="{ '--i': i }">
                <a class="grid-single__inner" :href="'#' + view.path + '/' + s.slug">
                  <div class="grid-single__img-wrap">
                    <div class="grid-single__img"
                         v-lazy="{ key: 'thumb-' + s.seed, bg: s.thumb, ratio: 1.3 }"></div>
                    <span v-if="view.film" class="play" aria-hidden="true"></span>
                  </div>
                  <div class="grid-single__caption caption-project">
                    <strong>{{ s.title }}</strong><br>
                    <span class="grid-single__meta">{{ s.meta }}</span>
                  </div>
                </a>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ---------- Series detail: lightbox hero + thumbnails ---------- -->
      <template v-else-if="view.kind === 'series'">
        <a class="close-page" :href="'#' + view.sectionPath" aria-label="Back to section">
          <span class="close-page__label">{{ view.sectionTitle }}</span>
        </a>

        <div class="lightbox-gallery">
          <div class="single-lightbox"
               @touchstart.passive="sliderStart"
               @touchmove.passive="sliderMove"
               @touchend="sliderEnd"
               @touchcancel="sliderEnd">
            <div class="single-lightbox__img-wrap">
              <div class="slider-viewport" ref="viewport">
                <div class="slider-track" :style="trackStyle">
                  <div class="slider-slide" v-for="s in slides" :key="s.key">
                    <img v-lazy="{ key: 'lb-' + s.item.key, src: s.item.src, srcset: s.item.srcset, sizes: imageSizes, ratio: s.item.ratio }"
                         :alt="s.item.caption"
                         loading="lazy"
                         decoding="async">
                  </div>
                </div>
              </div>
            </div>
            <button class="lightbox-nav lightbox-nav--prev" type="button" aria-label="Previous image" @click="seriesPrev"></button>
            <button class="lightbox-nav lightbox-nav--next" type="button" aria-label="Next image" @click="seriesNext"></button>
            <div class="lightbox-info">
              <span class="lightbox-info__count">{{ pad(seriesIndex + 1) }} / {{ pad(images.length) }}</span>
              <span class="lightbox-info__caption">{{ currentImage.caption }}</span>
            </div>
          </div>
        </div>

        <div class="grid-wrap">
          <div class="image-grid image-grid--thumbs">
            <div class="container container--half-pad">
              <div v-for="(img, i) in images"
                   class="grid-single"
                   :class="{ 'is-active': i === seriesIndex }"
                   :key="img.key"
                   :style="{ '--i': i }">
                <a class="grid-single__inner" :href="'#' + route + '/i/' + (i + 1)" @click.prevent="selectImage(i)">
                  <div class="grid-single__img-wrap">
                    <div class="grid-single__img"
                         v-lazy="{ key: 'st-' + img.key, bg: img.thumb, ratio: 1.3 }"></div>
                  </div>
                  <div class="grid-single__caption">
                    <strong>{{ view.series.title }}</strong><br>
                    <span class="grid-single__meta">{{ img.caption }}</span>
                  </div>
                </a>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ---------- List pages (Essays & Reviews / Exhibitions & Talks / News) ---------- -->
      <template v-else-if="view.kind === 'list'">
        <div class="grid-wrap">
          <div class="image-grid">
            <div class="container container--half-pad">
              <div v-for="(item, i) in view.items"
                   class="grid-single grid-single--list"
                   :key="item.slug"
                   :style="{ '--i': i }">
                <a class="grid-single__inner" :href="'#' + item.path">
                  <div class="grid-single__caption">
                    <strong>{{ item.title }}</strong><br>
                    <span class="grid-single__meta">{{ item.meta }}</span>
                  </div>
                </a>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ---------- One written piece (an item of a list section) ---------- -->
      <template v-else-if="view.kind === 'post'">
        <article class="article post">
          <div class="article__rule article__rule--short"></div>
          <p class="post__meta">{{ view.item.meta }}</p>
          <div class="article__body">
            <p class="article__lead">{{ view.item.body[0] }}</p>
            <p v-for="(para, i) in view.item.body.slice(1)" :key="i">{{ para }}</p>
          </div>
          <p class="post__back">
            <a :href="'#' + view.sectionPath">←&nbsp;{{ view.sectionTitle }}</a>
          </p>
        </article>
      </template>

      <!-- ---------- Biography ---------- -->
      <template v-else-if="view.kind === 'article'">
        <article class="article">
          <div class="article__rule article__rule--short"></div>
          <div class="article__body">
            <p class="article__lead">{{ view.lead }}</p>
            <p v-for="(para, i) in view.paragraphs" :key="i">{{ para }}</p>
            <h2>Selected publications</h2>
            <p>{{ view.publications }}</p>
            <h2>Representation</h2>
            <p>{{ view.representation }}</p>
          </div>
        </article>
      </template>

      <!-- ---------- Contact ---------- -->
      <template v-else-if="view.kind === 'contact'">
        <div class="grid-wrap">
          <div class="container container--half-pad">
            <div class="article__rule article__rule--short"></div>
            <div class="contact-columns">
              <div class="contact-col" v-for="col in view.columns" :key="col.title">
                <h2>{{ col.title }}</h2>
                <p v-for="(line, i) in col.lines" :key="i">
                  <a v-if="line.href" :href="line.href" :target="line.external ? '_blank' : null" rel="noopener">{{ line.text }}</a>
                  <template v-else>{{ line.text }}</template>
                </p>
              </div>
            </div>
          </div>
        </div>
      </template>

      <!-- ---------- 404 ---------- -->
      <template v-else>
        <div class="grid-wrap">
          <div class="container container--half-pad">
            <div class="article__rule article__rule--short"></div>
            <div class="article__body" style="padding-top:9px">
              <p class="article__lead">Not found.</p>
              <p>The page <code>{{ route }}</code> does not exist in this portfolio. Use the navigation above to browse the work.</p>
            </div>
          </div>
        </div>
      </template>
    </main>

    <!-- ===================== footer ===================== -->
    <footer class="site-footer" role="contentinfo">
      <div class="container">
        <div class="site-footer__wrap">
          <div class="footer-newsletter">
            <form class="newsletter-form" @submit.prevent="subscribe" novalidate>
              <p class="footer-paragraph">
                <a href="#" class="js-footer-toggle" @click.prevent="footerOpen = !footerOpen"
                   :aria-expanded="String(footerOpen)">Subscribe</a>
              </p>
              <fieldset v-if="footerOpen">
                <input type="email" class="input--text" name="subscriber_email" v-model="email"
                       placeholder="Enter your email address" aria-label="Email address">
                <input type="submit" class="input--button-blank newsletter-submit" value="Submit">
              </fieldset>
              <p class="footer-paragraph" v-if="subscribed">Thank you — please confirm by email.</p>
            </form>
            <div class="footer-social">
              <p class="footer-paragraph">
                <a href="https://www.instagram.com/" target="_blank" rel="noopener">Instagram</a>
                <a href="https://twitter.com/" target="_blank" rel="noopener">Twitter</a>
              </p>
            </div>
          </div>
          <div class="footer-copyright"><p class="footer-paragraph">&copy; {{ year }} Portfolio</p></div>
        </div>
      </div>
    </footer>
  </div>
 </div>
</div>

<!-- =====================================================================
     Vue 3 global (production) build.
     Local vendor copy first (instant, works offline), then two CDNs as a
     fallback so the file still runs when copied out on its own.
     The app itself is the single inline script block at the bottom.
     ===================================================================== -->
<script src="vendor/vue.global.prod.js"></script>
<script>if (!window.Vue) document.write('<script src="https://cdn.jsdelivr.net/npm/vue@3.4.38/dist/vue.global.prod.js"><\/script>');</script>
<script>if (!window.Vue) document.write('<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"><\/script>');</script>

<script>
/* ==========================================================================
   Portfolio — application script (single file, no build step)
   --------------------------------------------------------------------------
   Content is generated locally so the demo is self-contained. Photographs
   come from picsum.photos (seeded, greyscale) purely as placeholders — swap
   `photo()` / `photoSet()` for your own image URLs and nothing else changes.
   ========================================================================== */
(function () {
  'use strict';

  if (!window.Vue) {
    document.documentElement.classList.add('no-vue');
    var notice = document.createElement('div');
    notice.className = 'boot-error';
    notice.innerHTML = '<h1>Portfolio</h1><p>Vue 3 could not be loaded — neither the local ' +
      '<code>vendor/vue.global.prod.js</code> copy nor the CDN responded. Check the network or ' +
      'restore that file, then reload.</p>';
    document.body.appendChild(notice);
    return;
  }

  var MIN = Math.min;

  /* ------------------------------------------------------------------ *
   * 1. Imagery helpers
   * ------------------------------------------------------------------ */
  var PHOTO_BASE = 'https://picsum.photos/seed/';
  var PHOTO_WIDTHS = [480, 960, 1440];

  /** Single placeholder photograph. `ratio` = height / width. */
  function photo(seed, width, ratio) {
    return PHOTO_BASE + encodeURIComponent(seed) + '/' + width + '/' + Math.round(width * ratio) + '?grayscale';
  }
  /** Responsive candidate list so the browser picks a sensible file size. */
  function photoSet(seed, ratio) {
    return PHOTO_WIDTHS.map(function (w) { return photo(seed, w, ratio) + ' ' + w + 'w'; }).join(', ');
  }

  /** Deterministic hash, used for seeds and for the generated fallback plates. */
  function hash(str) {
    var h = 2166136261;
    for (var i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = (h * 16777619) >>> 0; }
    return h >>> 0;
  }

  /** A generated "unexposed plate" used when a photograph cannot be fetched
      (offline, blocked CDN). Keeps the layout looking intentional. */
  function plate(seed, ratio) {
    var h = 900, w = Math.round(h / (ratio || 1.3));
    var r = hash(String(seed));
    var shade = 210 + (r % 28);
    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#f7f7f7"/><stop offset="1" stop-color="rgb(' + shade + ',' + shade + ',' + shade + ')"/>' +
      '</linearGradient></defs>' +
      '<rect width="' + w + '" height="' + h + '" fill="url(#g)"/>' +
      '<g stroke="rgba(0,0,0,.06)">' +
      '<path d="M0 ' + (h * 0.5).toFixed(0) + 'H' + w + 'M' + (w * 0.5).toFixed(0) + ' 0V' + h + '"/>' +
      '<path d="M' + (w / 2 - 16) + ' ' + (h / 2) + 'h32M' + (w / 2) + ' ' + (h / 2 - 16) + 'v32" stroke="rgba(0,0,0,.18)"/>' +
      '</g></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }

  /* ------------------------------------------------------------------ *
   * 2. Lazy loader — IntersectionObserver, srcset aware, background aware
   *    • only the placeholder plate is painted until an element comes
   *      within 800px of the viewport
   *    • <img> gets src/srcset/sizes assigned; a div gets background-image
   *    • one retry on failure, then a generated plate
   *    • degrades to eager loading when IntersectionObserver is missing
   * ------------------------------------------------------------------ */
  var stats = Vue.reactive({ loaded: 0, total: 0, failed: 0 });

  var lazy = (function () {
    var supported = typeof window.IntersectionObserver === 'function';
    var registry = new Map();          /* element -> config */
    var observer = null;

    /* the footer counter always describes what is mounted right now */
    function refresh() {
      var total = 0, loaded = 0, failed = 0;
      registry.forEach(function (cfg, el) {
        total++;
        if (el.dataset.lazyState === 'done') loaded++;
        else if (el.dataset.lazyState === 'failed') failed++;
      });
      stats.total = total;
      stats.loaded = loaded;
      stats.failed = failed;
    }

    function ensureObserver() {
      if (observer || !supported) return observer;
      observer = new IntersectionObserver(function (entries) {
        for (var i = 0; i < entries.length; i++) {
          var entry = entries[i];
          if (!entry.isIntersecting) continue;
          observer.unobserve(entry.target);
          hydrate(entry.target);
        }
      }, { root: null, rootMargin: '800px 0px', threshold: 0.01 });
      return observer;
    }

    function observe(el, cfg) {
      if (!el || !cfg || (!cfg.src && !cfg.bg)) return;
      var previous = registry.get(el);
      if (previous && previous.key === cfg.key && el.dataset.lazyState) return; /* already handled */
      registry.set(el, cfg);
      el.classList.add('is-loading');

      if (!supported) { hydrate(el); return; }         /* eager fallback */
      ensureObserver().observe(el);
      refresh();
    }

    function release(el) {
      if (observer) observer.unobserve(el);
      registry.delete(el);
      refresh();
    }

    function markDone(el) {
      if (el.__lazyTimer) { clearTimeout(el.__lazyTimer); el.__lazyTimer = null; }
      el.dataset.lazyState = 'done';
      el.classList.remove('is-loading');
      el.classList.add('is-loaded');
      refresh();
    }

    function markFailed(el, cfg) {
      if (el.__lazyTimer) { clearTimeout(el.__lazyTimer); el.__lazyTimer = null; }
      el.dataset.lazyState = 'failed';
      el.classList.remove('is-loading');
      el.classList.add('is-fallback');
      var src = plate(cfg.key || cfg.src || cfg.bg, cfg.ratio);
      if (cfg.bg) { el.style.backgroundImage = 'url("' + src + '")'; el.classList.add('is-loaded'); }
      else {
        el.removeAttribute('srcset');
        el.removeAttribute('sizes');
        el.src = src;
        el.classList.add('is-loaded');
      }
      refresh();
    }

    function assignImage(el, cfg) {
      if (cfg.sizes) el.sizes = cfg.sizes;
      if (cfg.srcset) el.srcset = cfg.srcset;
      el.src = cfg.src;
    }

    function hydrate(el) {
      var cfg = registry.get(el);
      if (!cfg) return;
      var state = el.dataset.lazyState;
      if (state === 'loading' || state === 'done' || state === 'failed') return;
      el.dataset.lazyState = 'loading';

      /* never leave a plate pulsing forever: after 15s show the generated plate
         instead. If the real photograph still arrives later it takes over. */
      el.__lazyTimer = setTimeout(function () {
        if (el.dataset.lazyState === 'loading') markFailed(el, cfg);
      }, 15000);

      if (cfg.bg) {
        /* background images: preload through an Image() so we never flash.
           one retry, then the generated plate. */
        var attempt = function () {
          var probe = new Image();
          probe.decoding = 'async';
          probe.onload = function () { el.style.backgroundImage = 'url("' + cfg.bg + '")'; markDone(el); };
          probe.onerror = function () {
            if (!cfg.retried) { cfg.retried = true; setTimeout(attempt, 900); return; }
            markFailed(el, cfg);
          };
          probe.src = cfg.bg;
        };
        attempt();
        return;
      }

      el.onload = function () { markDone(el); };
      el.onerror = function () {
        if (!cfg.retried) {
          cfg.retried = true;
          setTimeout(function () {
            /* drop the attributes first so the browser really re-requests */
            el.removeAttribute('srcset');
            el.removeAttribute('src');
            assignImage(el, cfg);
          }, 900);
          return;
        }
        markFailed(el, cfg);
      };
      assignImage(el, cfg);
    }

    /* hydrate everything immediately (used by the debug hook / print) */
    function loadAll() {
      registry.forEach(function (cfg, el) { hydrate(el); });
    }

    return { observe: observe, release: release, loadAll: loadAll, stats: stats, supported: supported };
  })();

  window.portfolioLazy = lazy;   /* console: portfolioLazy.loadAll() */

  /* ------------------------------------------------------------------ *
   * 3. Content
   * ------------------------------------------------------------------ */
  var NAV = [
    { label: 'Studio Feed', path: '/' },
    { label: 'Works in Series', path: '/works-in-series' },
    { label: 'Portraits', path: '/portraits' },
    { label: 'Commissions', path: '/commissions' },
    { label: 'Film', path: '/film' },
    { label: 'Archive', path: '/archive' },
    { label: 'Monographs', path: '/monographs' },
    { label: 'Exhibitions & Talks', path: '/exhibitions' },
    { label: 'Essays & Reviews', path: '/essays-reviews' },
    { label: 'News', path: '/news' },
    { label: 'Biography', path: '/biography' },
    { label: 'Contact', path: '/contact' }
  ];

  var PLACES = [
    'London, England', 'Oslo, Norway', 'Tokyo, Japan', 'Reykjavik, Iceland',
    'Marrakesh, Morocco', 'Lisbon, Portugal', 'Kyoto, Japan', 'Berlin, Germany',
    'Cape Town, South Africa', 'Vancouver, Canada', 'Seoul, South Korea', 'Dublin, Ireland',
    'Athens, Greece', 'Wellington, New Zealand', 'Tbilisi, Georgia', 'Porto, Portugal'

      restartFeedTimer: function () { this.stopFeedTimer(); this.startFeedTimer(); },
      stopFeedTimer: function () { if (this.feedTimer) { window.clearInterval(this.feedTimer); this.feedTimer = null; } },

      /* warm both neighbours so paging never reveals a grey plate */
      prefetchNeighbour: function (list, index) {
        if (!list || list.length < 2) return;
        var self = this;
        [1, -1].forEach(function (delta) {
          var item = list[(index + delta + list.length) % list.length];
          if (!item || !item.src || item.__prefetched) return;
          item.__prefetched = true;
          var im = new Image();
          im.decoding = 'async';
          im.src = item.src;
        });
      },

      /* ---------- series ---------- */
      selectImage: function (i) {
        this.resetDrag();
        this.seriesIndex = i;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      },
      seriesNext: function () { this.step(1); },
      seriesPrev: function () { this.step(-1); },

      /* ---------- slider: finger-following paging ----------
         The track is a three-slide window. While the finger is down the track
         follows it; on release it either springs back or eases one frame across
         and then re-centres silently. Vertical page scrolling and pinch-zoom
         stay entirely with the browser (touch-action: pan-y pinch-zoom), so only
         a genuine horizontal drag is ever claimed and a tap still reaches the
         arrow zones. */
      viewportWidth: function () {
        var el = this.$refs.viewport;
        return el ? el.clientWidth : window.innerWidth;
      },
      resetDrag: function () {
        if (this.drag.timer) { window.clearTimeout(this.drag.timer); this.drag.timer = null; }
        this.drag.active = false;
        this.drag.axis = null;
        this.drag.animating = false;
        this.drag.pendingDir = 0;
        this.drag.dx = 0;
      },
      sliderStart: function (e) {
        var t = (e.touches && e.touches.length === 1) ? e.touches[0] : null;
        this.resetDrag();
        if (!t || this.slideList.length < 2) return;
        this.drag.active = true;
        this.drag.startX = t.clientX;
        this.drag.startY = t.clientY;
        this.drag.time = Date.now();
        this.drag.width = this.viewportWidth();
      },
      sliderMove: function (e) {
        if (!this.drag.active) return;
        var t = e.touches && e.touches[0];
        if (!t) return;
        var dx = t.clientX - this.drag.startX;
        var dy = t.clientY - this.drag.startY;
        if (!this.drag.axis) {
          if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;          /* let the gesture declare itself */
          this.drag.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
        }
        if (this.drag.axis !== 'x') return;                          /* vertical: leave it to the page */
        this.drag.dx = dx;                                           /* the image follows the finger */
      },
      sliderEnd: function () {
        if (!this.drag.active) return;
        this.drag.active = false;
        var axis = this.drag.axis;
        this.drag.axis = null;
        if (axis !== 'x') { this.drag.dx = 0; return; }
        var w = this.drag.width || this.viewportWidth() || 1;
        var dx = this.drag.dx;
        var ms = Math.max(1, Date.now() - this.drag.time);
        var far = Math.abs(dx) > w * 0.22;                           /* dragged more than a fifth across */
        var flick = Math.abs(dx) > 24 && Math.abs(dx) / ms > 0.45;   /* or flicked hard enough */
        if (!far && !flick) {                                        /* spring back */
          var self = this;
          this.drag.animating = true;
          this.drag.dx = 0;
          window.setTimeout(function () { self.drag.animating = false; }, this.slideMs);
          return;
        }
        this.step(dx < 0 ? 1 : -1);
      },
      step: function (dir) {
        var list = this.slideList;
        if (!list || list.length < 2) return;
        var self = this;
        var w = this.viewportWidth() || 1;
        if (this.drag.timer) {                                       /* finish the frame in flight first */
          window.clearTimeout(this.drag.timer);
          this.commit(this.drag.pendingDir);
          this.drag.timer = null;
          this.drag.animating = false;
          this.drag.dx = 0;
        }
        this.drag.pendingDir = dir;
        this.drag.animating = true;
        this.drag.dx = -dir * w;                                     /* ease one frame across */
        this.drag.timer = window.setTimeout(function () {
          self.commit(self.drag.pendingDir);                         /* swap, then re-centre silently */
          self.drag.timer = null;
          self.drag.animating = false;
          self.drag.dx = 0;
        }, this.slideMs);
      },
      commit: function (dir) {
        if (!dir) return;
        if (this.view.kind === 'feed') {
          this.feedIndex = (this.feedIndex + dir + this.feedItems.length) % this.feedItems.length;
          this.restartFeedTimer();
        } else if (this.view.kind === 'series') {
          this.seriesIndex = (this.seriesIndex + dir + this.images.length) % this.images.length;
        }
      },

      /* ---------- footer ---------- */
      subscribe: function () {
        if (!this.email) return;
        this.subscribed = true;
        this.email = '';
        this.footerOpen = false;
      },

      /* ---------- utilities ---------- */
      pad: function (n) { return (n < 10 ? '0' : '') + n; }
    }
  });

  /* the lazy directive: value = { key, src, srcset, sizes, bg, ratio } */
  app.directive('lazy', {
    mounted: function (el, binding) { lazy.observe(el, binding.value); },
    updated: function (el, binding) {
      var next = binding.value, prev = binding.oldValue;
      if (!next) return;
      if (!prev || next.key !== prev.key) lazy.observe(el, next);
    },
    unmounted: function (el) { lazy.release(el); }
  });

  app.mount('#app');
})();
</script>
</body>
</html>
